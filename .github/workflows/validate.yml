name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplaces, plugins, and skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run repository validator
        run: python3 scripts/validate_repo.py

      - name: Run Handoff tests
        run: python3 -m unittest tests/test_handoff.py -v

      - name: Run Grok ACP client tests
        run: python3 -m unittest tests/test_grok_acp.py -v

      - name: Validate Godot skill packages
        run: |
          python3 skills/godot-engineering-suite/scripts/validate_skill_suite.py
          python3 skills/godot-ui-design-excellence/scripts/validate_package.py

      - name: Run Godot UI utility tests
        run: python3 -m unittest discover -s skills/godot-ui-design-excellence/tests -v

      - name: Validate Webdesign skill package
        run: python3 skills/webdesign-excellence/scripts/validate_package.py
